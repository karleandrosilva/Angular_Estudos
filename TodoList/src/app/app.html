<style>
 
</style>

<main class="todo-container">
  <section class="title">
    <h1>
      <i class="bi bi-journal-check"></i>
      Lista de Tarefas
    </h1>
  </section>
  
  <section class="add-task">
    <input [(ngModel)] = "newTask" placeholder="Nova Tarefa"> <!--  ligação bidirecional (tudo que escrever no input, vai salvar na variavel) | placeholder: frase que fica dentro do input -->

    <button (click)="addTask()">
      <i class="bi bi-plus-circle"></i>
    </button>
  </section>

  <ul class="task-list">
    @for (todoItem of todoList; track $index) {

      <li [ngClass]="{'completed':todoItem.completed}">
        <input type="checkbox" [(checked)]="todoItem.completed" (change)="toggleCompleted($index)">
        
        <span [class.completed]="todoItem.completed">{{todoItem.task}}</span>

        <button (click)="deleteTask(todoItem.id)"><i class="bi bi-trash-fill"></i></button>
      </li>

    }
    
  </ul>
</main>


<router-outlet />
