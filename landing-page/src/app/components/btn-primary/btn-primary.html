<button 
    (click)="submit()"  
    [class]="'btn ' + variant" 
    [disabled]="disabled"
>

    @if (!loading) {
        {{ btnText }}
    } @else {
        carregando...
    }
</button>

<!-- (click)="submit()" | Quando clicar, chama o método submit() do TS -->

<!-- [class]="'btn ' + variant" | Gera: class="btn primary" ou class="btn secondary" -->
  
<!--  [disabled]="disabled" | Desativa o botão se disabled for true -->
