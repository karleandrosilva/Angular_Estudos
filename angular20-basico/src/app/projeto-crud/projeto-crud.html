<form action="" [formGroup]="pessoa">

    <input type="text" placeholder="Nome" formControlName="nome" class="form-control">
    <input type="number" placeholder="Idade" formControlName="idade" class="form-control">
    <input type="text" placeholder="Cidade" formControlName="cidade" class="form-control">

    @if(btnCadastrar) {  
        <input type="button" value="Cadastrar" class="btn btn-primary">
    } @else {

        <input type="button" value="Alterar" class="btn btn-primary">
        <input type="button" value="Remover" class="btn btn-primary">
        <input type="button" value="Cancelar" class="btn btn-primary">

    }
    
</form>

<table class="table">

    <thead> <!-- cabecalho de tabela -->
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
            <th>Selecionar</th>
        </tr>
    </thead> 
        
    <tbody>
        
    </tbody>

</table>
